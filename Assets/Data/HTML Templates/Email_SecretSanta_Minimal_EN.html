<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Santa</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:560px;max-width:560px;">
          <tr>
            <td style="border-top:4px solid #c45c26;padding:24px 0 0;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;font-size:16px;line-height:1.5;">
              <p style="margin:0 0 16px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#c45c26;">Secret Santa</p>
              <p style="margin:0 0 16px;">Hi {UserName},</p>
              <p style="margin:0 0 16px;">You are the Secret Santa for <strong>{SecretSantaName}</strong>.</p>
              <p style="margin:0 0 8px;">Email: {SecretSantaEmail}</p>
              <p style="margin:0 0 16px;">Phone: {SecretSantaPhone}</p>
              <p style="margin:0;color:#555555;">Please keep this to yourself until the gift exchange.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
